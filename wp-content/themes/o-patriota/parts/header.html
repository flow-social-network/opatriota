<!-- wp:group {"tagName":"header","className":"site-header","layout":{"type":"constrained"}} -->
<header class="wp-block-group site-header">
  <!-- FAIXA SUPERIOR CINZA -->
  <div class="top-bar">
    <div class="patriota-header-inner top-bar-inner">
      <div class="top-bar-left">
        <!-- wp:shortcode -->[o_patriota_data_atual]<!-- /wp:shortcode -->
        <span class="header-divider" aria-hidden="true"></span>
        <div id="patriota-weather-widget" class="patriota-weather-widget" data-source="open-meteo" data-reference="inmet">
          <button id="patriota-weather-pill" class="patriota-weather-pill" type="button" title="Ver previsão do tempo das capitais">
            <span id="weather-status-dot" class="weather-status-dot" title="Sincronizando"></span>
            <span id="weather-city-label">Brasília (DF)</span>
            <span aria-hidden="true">☀</span>
            <strong id="weather-temp-label">--°C</strong>
            <span id="weather-condition-label" class="weather-condition-label">Consultando previsão...</span>
            <span class="weather-inmet-badge">INMET</span>
          </button>
        </div>
      </div>
      <div class="top-bar-right">
        <nav class="institutional-links" aria-label="Links institucionais">
          <a href="/sobre-o-patriota/">Sobre</a>
          <a href="/principios-editoriais/">Princípios</a>
          <a href="/expediente/">Expediente</a>
          <a class="institutional-plans" href="/planos/">Planos</a>
          <a href="/contato/">Contato</a>
        </nav>
        <div class="social-icons" aria-label="Redes sociais">
          <a href="#" aria-label="Facebook">f</a>
          <a href="#" aria-label="Instagram">◎</a>
          <a href="#" aria-label="YouTube">▶</a>
          <a href="#" aria-label="X">𝕏</a>
          <a href="#" aria-label="RSS">◔</a>
        </div>
        <form class="header-search" role="search" method="get" action="/">
          <label class="screen-reader-text" for="patriota-header-search">Buscar notícias</label>
          <input id="patriota-header-search" type="search" name="s" placeholder="Buscar notícias, análises, vídeos..." />
          <button type="submit" aria-label="Buscar">⌕</button>
        </form>
        <a class="header-login" href="/entrar/">♙ <span>ENTRAR</span></a>
      </div>
    </div>
  </div>

  <!-- FAIXA DE MERCADOS / INDICADORES -->
  <div id="patriota-weather-ticker-bar" class="weather-ticker-bar">
    <div class="patriota-header-inner ticker-inner">
      <strong class="ticker-label">● PREVISÃO DAS CAPITAIS</strong>
      <div id="weather-ticker-list" class="ticker-list" aria-live="polite">
        <span>Carregando indicadores e previsão das capitais...</span>
      </div>
      <button id="weather-ticker-title-btn" class="ticker-more" type="button">Ver previsão completa ›</button>
      <button id="weather-view-all-modal-btn" class="ticker-view-all" type="button">Todas as capitais ↗</button>
    </div>
  </div>

  <!-- MARCA CENTRAL E PILARES EDITORIAIS -->
  <div class="branding-bar">
    <div class="patriota-header-inner branding-inner">
      <div class="branding-quote">“Um jornal livre ajuda a construir<br>um país mais forte.”</div>
      <div class="logo-center">
        <!-- wp:site-logo {"width":300} /-->
        <!-- wp:site-title {"level":1} /-->
        <!-- wp:site-tagline /-->
      </div>
      <div class="editorial-pillars">
        <span>FATOS</span><span>IDEIAS</span><span>PESSOAS</span><span>SOLUÇÕES</span><strong>PELO BRASIL</strong>
      </div>
    </div>
  </div>

  <!-- NAVEGAÇÃO PRINCIPAL -->
  <div class="main-navigation">
    <div class="patriota-header-inner navigation-inner">
      <!-- wp:navigation {"layout":{"type":"flex","justifyContent":"left","orientation":"horizontal"}} /-->
      <a class="support-journal-button" href="/apoie-o-jornal/">♡ APOIE O JORNAL</a>
    </div>
  </div>
</header>
<!-- /wp:group -->
