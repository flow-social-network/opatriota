name: Backend and frontend checks

on:
  push:
    branches: [main, feature/efi-assinaturas]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and reconcile lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: DATABASE_URL='postgresql://ci:ci@localhost:5432/opatriota?schema=public' pnpm exec prisma validate --schema prisma/schema.prisma
      - name: Generate Prisma Client
        run: DATABASE_URL='postgresql://ci:ci@localhost:5432/opatriota?schema=public' pnpm exec prisma generate --schema prisma/schema.prisma
      - name: Type-check backend
        run: pnpm backend:check
      - name: Type-check operational core
        run: pnpm core:check
      - name: Build frontend
        run: pnpm build
